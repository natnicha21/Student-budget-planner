<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Budget Planner</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Prompt', sans-serif;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #f8fafc;
            color: #1e293b;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .app-container {
            width: 100%;
            max-width: 430px; /* ขนาดหน้าจอมือถือ */
            background: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            padding-bottom: 80px;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }
        /* Header */
        .header {
            padding: 20px 20px 10px 20px;
        }
        .header h2 {
            font-size: 14px;
            color: #64748b;
            font-weight: 400;
        }
        .header h1 {
            font-size: 22px;
            color: #0f172a;
            font-weight: 600;
        }
        
        /* Views / Pages */
        .tab-content {
            display: none;
            padding: 0 20px;
            animation: fadeIn 0.2s ease-in-out;
        }
        .tab-content.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Balance Main Card */
        .main-card {
            background: #2563eb;
            color: white;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.3);
            margin-bottom: 16px;
        }
        .main-card p {
            font-size: 14px;
            opacity: 0.9;
        }
        .main-card h2 {
            font-size: 32px;
            font-weight: 700;
            margin-top: 4px;
        }

        /* Stat Grid */
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: white;
            padding: 16px;
            border-radius: 16px;
            border: 1px solid #f1f5f9;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }
        .stat-card span {
            font-size: 13px;
            color: #64748b;
        }
        .stat-card p {
            font-size: 18px;
            font-weight: 600;
            margin-top: 2px;
        }
        .stat-card.income p { color: #16a34a; }
        .stat-card.expense p { color: #dc2626; }

        /* Action Button */
        .btn-primary {
            width: 100%;
            background: #2563eb;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
            transition: transform 0.1s;
        }
        .btn-primary:active {
            transform: scale(0.98);
        }

        /* List Items */
        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin: 20px 0 12px 0;
            color: #1e293b;
        }
        .card-list {
            background: white;
            border-radius: 16px;
            padding: 8px 16px;
            border: 1px solid #f1f5f9;
        }
        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f1f5f9;
        }
        .list-item:last-child { border-bottom: none; }
        .list-info h4 { font-size: 15px; font-weight: 500; }
        .list-info p { font-size: 12px; color: #94a3b8; }
        .amount { font-weight: 600; font-size: 15px; }
        .amount.plus { color: #16a34a; }
        .amount.minus { color: #dc2626; }

        /* Bottom Nav Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 430px;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 10px 0 16px 0;
            border-top: 1px solid #f1f5f9;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.03);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #94a3b8;
            font-size: 11px;
            cursor: pointer;
            text-decoration: none;
            width: 20%;
        }
        .nav-item i {
            font-size: 18px;
            margin-bottom: 4px;
        }
        .nav-item.active {
            color: #2563eb;
            font-weight: 600;
        }

        /* AI Chat Box Section */
        .ai-chat-box {
            background: white;
            border-radius: 16px;
            padding: 16px;
            border: 1px solid #e2e8f0;
            height: 380px;
            display: flex;
            flex-direction: column;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 5px;
        }
        .msg {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 13px;
            line-height: 1.4;
        }
        .msg.ai {
            background: #f1f5f9;
            color: #1e293b;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        .msg.user {
            background: #2563eb;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .chat-input-area {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .chat-input-area input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
            font-size: 13px;
        }
        .chat-input-area button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 0 16px;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>

                <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                    <button style="flex:1; padding:10px; border-radius:10px; border:1px solid #2563eb; background:#eff6ff; color:#2563eb; font-weight:600;">รายจ่าย</button>
                    <button style="flex:1; padding:10px; border-radius:10px; border:1px solid #cbd5e1; background:white; color:#64748b;">รายรับ</button>
                </div>
                <input type="number" placeholder="จำนวนเงิน (บาท)" style="width:100%; padding:12px; border:1px solid #cbd5e1; border-radius:10px; margin-bottom:12px; font-size:16px;">
                <input type="text" placeholder="รายละเอียด (เช่น ค่าข้าว)" style="width:100%; padding:12px; border:1px solid #cbd5e1; border-radius:10px; margin-bottom:15px; font-size:14px;">
                <button class="btn-primary">บันทึกรายการ</button>
            </div>
        </div>
