<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Student Budget Planner</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Prompt', sans-serif;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #f8fafc;
            color: #1e293b;
            display: flex;
            justify-content: center;
            overflow: hidden;
        }
        .app-container {
            width: 100%;
            max-width: 430px;
            background: #f8fafc;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }
        .header {
            padding: 16px 20px 8px 20px;
            flex-shrink: 0;
        }
        .header h2 {
            font-size: 13px;
            color: #64748b;
            font-weight: 400;
        }
        .header h1 {
            font-size: 20px;
            color: #0f172a;
            font-weight: 600;
        }
        
        /* Scrollable Content Area */
        .content-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 0 20px 90px 20px;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.2s ease-in-out;
        }
        .tab-content.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(3px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .main-card {
            background: #2563eb;
            color: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.3);
            margin-bottom: 14px;
        }
        .main-card p {
            font-size: 13px;
            opacity: 0.9;
        }
        .main-card h2 {
            font-size: 28px;
            font-weight: 700;
            margin-top: 2px;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }
        .stat-card {
            background: white;
            padding: 14px;
            border-radius: 16px;
            border: 1px solid #f1f5f9;
        }
        .stat-card span {
            font-size: 12px;
            color: #64748b;
        }
        .stat-card p {
            font-size: 16px;
            font-weight: 600;
            margin-top: 2px;
        }
        .stat-card.income p { color: #16a34a; }
        .stat-card.expense p { color: #dc2626; }
        .btn-primary {
            width: 100%;
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }
        .section-title {
            font-size: 15px;
            font-weight: 600;
            margin: 16px 0 10px 0;
            color: #1e293b;
        }
        .card-list {
            background: white;
            border-radius: 16px;
            padding: 6px 16px;
            border: 1px solid #f1f5f9;
        }
        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f1f5f9;
        }
        .list-item:last-child { border-bottom: none; }
        .list-info h4 { font-size: 14px; font-weight: 500; }
        .list-info p { font-size: 11px; color: #94a3b8; }
        .amount { font-weight: 600; font-size: 14px; }
        .amount.plus { color: #16a34a; }
        .amount.minus { color: #dc2626; }

        /* Bottom Nav Bar - Fixed at bottom */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 10px 0 16px 0;
            border-top: 1px solid #f1f5f9;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.03);
            z-index: 100;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #94a3b8;
            font-size: 11px;
            cursor: pointer;
            text-decoration: none;
            width: 20%;
        }
        .nav-item i {
            font-size: 18px;
            margin-bottom: 3px;
        }
        .nav-item.active {
            color: #2563eb;
            font-weight: 600;
        }

        /* AI Chat Box */
        .ai-chat-box {
            background: white;
            border-radius: 16px;
            padding: 14px;
            border: 1px solid #e2e8f0;
            height: calc(100vh - 160px);
            display: flex;
            flex-direction: column;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 4px;
        }
        .msg {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 13px;
            line-height: 1.4;
        }
        .msg.ai {
            background: #f1f5f9;
            color: #1e293b;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        .msg.user {
            background: #2563eb;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .chat-input-area {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .chat-input-area input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
            font-size: 13px;
        }
        .chat-input-area button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 0 16px;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="header">
            <h2 id="currentDate">ตุลาคม 2569</h2>
            <h1 id="pageTitle">หน้าหลัก</h1>
        </div>

        <div class="content-scroll">
            <!-- TAB 1: หน้าหลัก -->
            <div id="tab-home" class="tab-content active">
                <div class="main-card">
                    <p>ยอดเงินคงเหลือ</p>
                    <h2>฿4,200.00</h2>
                </div>

                <div class="stat-grid">
                    <div class="stat-card income">
                        <span>รายรับ</span>
                        <p>฿6,000</p>
                    </div>
                    <div class="stat-card expense">
                        <span>รายจ่าย</span>
                        <p>฿1,800</p>
                    </div>
                </div>

                <button class="btn-primary" onclick="switchTab('tab-add', 'เพิ่มรายการ')">+ เพิ่มรายการ</button>

                <h3 class="section-title">รายการล่าสุด</h3>
                <div class="card-list">
                    <div class="list-item">
                        <div class="list-info">
                            <h4>ข้าวกลางวัน</h4>
                            <p>อาหาร • วันนี้</p>
                        </div>
                        <div class="amount minus">-฿60</div>
                    </div>
                    <div class="list-item">
                        <div class="list-info">
                            <h4>ค่ารถ</h4>
                            <p>เดินทาง • เมื่อวาน</p>
                        </div>
                        <div class="amount minus">-฿40</div>
                    </div>
                    <div class="list-item">
                        <div class="list-info">
                            <h4>เงินจากผู้ปกครอง</h4>
                            <p>รายรับ • 1 ต.ค.</p>
                        </div>
                        <div class="amount plus">+฿6,000</div>
                    </div>
                </div>
            </div>

            <!-- TAB 2: รายการ -->
            <div id="tab-add" class="tab-content">
                <div class="card-list" style="padding: 20px;">
                    <h3 style="margin-bottom: 14px;">บันทึกรายการใหม่</h3>
                    <div style="display: flex; gap: 10px; margin-bottom: 14px;">
                        <button style="flex:1; padding:10px; border-radius:10px; border:1px solid #2563eb; background:#eff6ff; color:#2563eb; font-weight:600;">รายจ่าย</button>
                        <button style="flex:1; padding:10px; border-radius:10px; border:1px solid #cbd5e1; background:white; color:#64748b;">รายรับ</button>
                    </div>
                    <input type="number" placeholder="จำนวนเงิน (บาท)" style="width:100%; padding:12px; border:1px solid #cbd5e1; border-radius:10px; margin-bottom:12px; font-size:15px;">
                    <input type="text" placeholder="รายละเอียด (เช่น ค่าข้าว)" style="width:100%; padding:12px; border:1px solid #cbd5e1; border-radius:10px; margin-bottom:14px; font-size:14px;">
                    <button class="btn-primary" onclick="alert('บันทึกเรียบร้อย!')"
